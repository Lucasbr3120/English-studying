name: Gerar APK Automático

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Configurar Gradle Atualizado (9.3.1)
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '9.3.1'

    - name: Criar Chave de Segurança e Arquivo Gradlew
      run: |
        # Cria a chave de segurança na raiz principal
        keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        
        # Força a criação do arquivo gradlew que está faltando na raiz
        gradle wrapper --gradle-version 9.3.1

    - name: Compilar APK Final
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Entregar APK Pronto
      uses: actions/upload-artifact@v4
      with:
        name: meu-aplicativo-instalador
        path: |
          app/build/outputs/apk/debug/*.apk